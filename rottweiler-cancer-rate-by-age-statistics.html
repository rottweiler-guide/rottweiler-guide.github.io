<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="google-site-verification" content="googled82ff9901477ec4d"><title>Moved</title><link rel="canonical" href="https://rottweiler-guide.github.io/care.html"><meta name="robots" content="noindex, follow"><meta http-equiv="refresh" content="0; url=/care.html"><style id="rwg-cut">
:root{--rwg-paper:#F6F1E7;--rwg-ink:#191512;--rwg-rust:#7A2E1E;--rwg-mute:#5B5049;--rwg-line:#D9CDBB;--rwg-tint:#EFE7D9;--link:#0B5C74;
--display:Rockwell,"Roboto Slab",Georgia,serif;--body:"Fira Sans","Segoe UI",Roboto,system-ui,sans-serif}
body{background:var(--rwg-paper);color:var(--rwg-ink);font-family:var(--body)}
h1,h2,h3{font-family:var(--display)}
.rwg-skip{position:absolute;left:-9999px}.rwg-skip:focus{left:12px;top:12px;z-index:9;background:#fff;padding:10px 14px;border:1px solid var(--rwg-line)}
.rwg-mast{background:var(--rwg-ink);border-bottom:6px double var(--rwg-rust)}
.rwg-mast-in{max-width:1100px;margin:0 auto;padding:0 20px;min-height:64px;display:flex;align-items:center;gap:6px 20px;flex-wrap:wrap}
.rwg-brand,.rwg-brand:visited{color:#F6F1E7;text-decoration:none;font:700 21px/1 var(--display);letter-spacing:.02em;min-height:44px;display:flex;align-items:center}
.rwg-brand b{color:#E3876B;margin-left:8px;font-weight:700}
.rwg-nav{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap}
.rwg-nav a,.rwg-nav a:visited{color:#D8CCBC;text-decoration:none;padding:12px 12px;display:block;font-size:14.5px}
.rwg-nav a:hover,.rwg-nav a[aria-current]{color:#fff;border-bottom:3px solid #E3876B}
.rwg-mobile{margin-left:auto;display:none}
.rwg-mobile summary{list-style:none;cursor:pointer;color:#F6F1E7;border:1px solid #6B5C50;padding:8px 12px;font-size:14px}
.rwg-mobile summary::-webkit-details-marker{display:none}
.rwg-mobile nav{position:absolute;right:16px;background:var(--rwg-paper);border:1px solid var(--rwg-line);min-width:220px;z-index:8;padding:6px 0}
.rwg-mobile nav a{display:block;padding:11px 16px;color:var(--rwg-ink);text-decoration:none;border-bottom:1px solid var(--rwg-line)}
@media(max-width:800px){.rwg-nav{display:none}.rwg-mobile{display:block}}
.rwg-hero{background:var(--rwg-tint);border-bottom:1px solid var(--rwg-line)}
.rwg-hero-in{max-width:1100px;margin:0 auto;padding:44px 20px 30px}
.rwg-eyebrow{margin:0 0 10px;font:700 12px/1.4 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--rwg-rust)}
.rwg-hero h1{margin:0 0 12px;font-size:clamp(30px,4.6vw,52px);line-height:1.08;max-width:860px}
.rwg-hero .rwg-lead{margin:0 0 22px;font-size:19px;color:var(--rwg-mute);max-width:720px}
.rwg-hero .rwg-video{max-width:900px}
.rwg-btn,.rwg-btn:visited{display:inline-block;background:var(--rwg-rust);color:#fff;text-decoration:none;padding:13px 20px;font-weight:700}
.rwg-btn:hover{background:#5E2216}
.rwg-quiet{margin-left:16px;font-weight:700}
.rwg-blk{max-width:1100px;margin:0 auto;padding:36px 20px}
.rwg-blk h2{margin:0 0 6px;font-size:clamp(23px,3vw,31px)}
.rwg-lead2{margin:0 0 20px;color:var(--rwg-mute);max-width:700px}
.rwg-video{margin:0}
.rwg-video a,.rwg-video a:visited{display:block;color:inherit;text-decoration:none;border:1px solid var(--rwg-line);background:#fff}
.rwg-poster{display:block;position:relative;aspect-ratio:16/9;background:center/cover no-repeat #221B17}
.rwg-play{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:30px;background:linear-gradient(transparent 45%,#0007)}
.rwg-video b{display:block;padding:10px 12px 0;font-size:15.5px}
.rwg-video small{display:block;padding:3px 12px 12px;font-size:12.5px;color:var(--rwg-mute)}
.rwg-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.rwg-num{list-style:none;counter-reset:rwg;margin:0;padding:0;border-top:2px solid var(--rwg-ink)}
.rwg-num li{counter-increment:rwg;border-bottom:1px solid var(--rwg-line);padding:14px 0 14px 54px;position:relative}
.rwg-num li::before{content:counter(rwg,decimal-leading-zero);position:absolute;left:0;top:15px;font:700 15px/1 var(--display);color:var(--rwg-rust)}
.rwg-num a,.rwg-num a:visited{color:var(--rwg-ink);text-decoration:none;font-weight:700;font-size:17px}
.rwg-num a:hover{color:var(--rwg-rust)}
.rwg-num time{display:block;margin-top:4px;font-size:12.5px;color:var(--rwg-mute);letter-spacing:.03em}
.rwg-foot{background:var(--rwg-ink);color:#CBBDAC;margin-top:48px;border-top:6px double var(--rwg-rust)}
.rwg-foot-in{max-width:1100px;margin:0 auto;padding:30px 20px;display:flex;gap:26px;flex-wrap:wrap;justify-content:space-between}
.rwg-foot a,.rwg-foot a:visited{color:#E4D8C6;text-decoration:none;margin-right:16px;font-size:14px;display:inline-block;padding:6px 0}
.rwg-foot p{margin:0;font-size:13px;max-width:520px}
@media print{.rwg-mast,.rwg-foot,.rwg-mobile{display:none!important}}
</style>
</head><body><p><a href="/care.html">https://rottweiler-guide.github.io/care.html</a></p></body></html>
